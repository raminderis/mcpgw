services:
  ui:
    image: golang:1.26
    restart: always
    working_dir: /workspace/ui
    command: ["go", "run", "./main.go"]
    environment:
      CFGMGR_URL: http://host.docker.internal:8091/addgwconfig
    ports:
      - "8090:8090"
    volumes:
      - ./:/workspace

  gwsvc:
    image: golang:1.26
    restart: always
    working_dir: /workspace
    command: ["go", "run", "./gwsvc/cmd/gwsvc/main.go"]
    environment:
      GWSVC_CONFIG_FILE: /shared/gwsvc-config.json
      NEO4J_MCP_ENDPOINT: http://neo4j-mcp:9094/mcp
    volumes:
      - ./:/workspace
      - gwsvc_shared_config:/shared
    depends_on:
      - neo4j-mcp

  cfgUpdater:
    image: golang:1.26
    restart: always
    working_dir: /workspace
    command: ["go", "run", "./gwsvc/cmd/cfgUpdater/main.go"]
    environment:
      CFG_UPDATER_PORT: :9091
      NEO4J_HTTP_PORT: "9094"
      GWSVC_CONFIG_FILE: /shared/gwsvc-config.json
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: cfgmgr
      DB_PASSWORD: changeme_password
      DB_NAME: cfgmgr
    ports:
      - "9091:9091"
    volumes:
      - ./:/workspace
      - gwsvc_shared_config:/shared
    depends_on:
      - db

  gwClient:
    image: golang:1.26-alpine
    restart: unless-stopped
    working_dir: /workspace
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace
    depends_on:
      - gwsvc

  neo4j-mcp:
    image: debian:bookworm-slim
    restart: always
    command: ["/neo4j-mcp/neo4j-mcp", "--neo4j-http-host", "0.0.0.0", "--neo4j-http-port", "9094"]
    environment:
      NEO4J_URI: "bolt://YOUR_NEO4J_ENDPOINT:7687"
      NEO4J_TRANSPORT_MODE: "http"
      NEO4J_MCP_HTTP_TLS_ENABLED: "false"
      NEO4J_TELEMETRY: "false"
    ports:
      - "9094:9094"
    volumes:
      - ./mcp_servers_external/neo4j-mcp_Linux_x86_64:/neo4j-mcp

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: cfgmgr
      POSTGRES_PASSWORD: changeme_password
      POSTGRES_DB: cfgmgr
    ports:
      - "5432:5432"
    volumes:
      - cfgmgr_db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DESIGN: dracula
    ports:
      - "3333:8080"

volumes:
  cfgmgr_db_data:
  gwsvc_shared_config:
